schema: spec-driven

# Project context — injected into all OpenSpec artifact instructions.
# Source: .cursor/rules/*.mdc
context: |
    # Only One Hub — Project Context

    ## Tech stack
    Next.js 16 (App Router) + React 19 + TypeScript + Ant Design 5 + Refine.dev + Tailwind/DaisyUI + Zustand + NextAuth + Socket.io.

    ## src/ structure
    | Folder | Purpose |
    |--------|---------|
    | `app/` | Routes: `(public)/` login, `(root)/` protected, `api/` |
    | `components/common` | Shared UI (StatusTag, Loading, …) |
    | `components/custom` | Ant Design wrappers (CustomModal, TableContainer, …) |
    | `components/layout` | Header, Sidebar, Footer |
    | `components/module/` | Feature UI (scraping, schedule, gallery, …) |
    | `hooks/` | Custom hooks (useTableContainer, useCustomModal, …) |
    | `services/` | API classes (extends BaseApi) |
    | `interfaces/` | Types `.d.ts` with namespace (`NSchedule`, …) |
    | `enums/` | Domain constants |
    | `constants/`, `libs/`, `stores/`, `contexts/` | Support layers |

    ## Imports & barrels
    - Use alias `@/…` (ESLint enforced); relative imports only within the same folder.
    - Import from folder root barrel (`index.ts`), never deep into child files when a barrel exists.
    - Barrel map: `@/interfaces`, `@/enums`, `@/hooks`, `@/constants`, `@/services`, `@/components/custom`, `@/components/common`, `@/components/module/<feature>` (per-feature barrel; no `@/components/module` root).
    - Every module folder must have `index.ts` with `export * from './…'` only (no per-symbol exports unless rename needed).
    - Source files use named exports (`export const X`, `export type { X }`).

    ## UI layer priority
    1. `@/components/custom` — project Ant Design wrappers
    2. `@/components/common` — shared non-wrapper UI
    3. Ant Design direct — only when no wrapper exists yet

    Custom components (`@/components/custom`):
    - Wrapper layer only; no business logic or API fetch.
    - Folder: `custom-<kebab>/`, component: `Custom<Name>`, props: `Custom<Name>Props`.
    - Static config → `src/constants/custom-components.constant.ts` (prefix `CUSTOM_<COMPONENT>_…`).
    - Shared types → `src/interfaces/custom-component.d.ts`.
    - Before creating a new wrapper: scan codebase for existing Ant Design usage, unify all use cases, then migrate all usages.
    - Use skill `ui-ux-pro-max` for spacing, contrast, responsive (375 / 768 / 1024+), focus states.
    - Icons: `@iconify/react` (Lucide/Heroicons); no emoji as icons.

    ## Data & CRUD
    - Prefer Refine: `useTable`, `useModalForm`, `useTableContainer`, `useCustomModal`.
    - Tables: `useTableContainer` + `TableContainer` + `CustomFilter`.
    - Form modals: `useCustomModal` + `CreateFormModal` / `EditFormModal`.
    - Do not fetch with axios in pages when Refine already covers the resource.

    ## TypeScript
    - Domain types: `src/interfaces/<domain>.d.ts` with `export declare namespace NDomain { … }`.
    - Entities extend `Abstract` from `@/interfaces`.
    - Domain constants: `enum` in `src/enums/`, export via barrel.
    - Avoid `any`; empty lists: `!list?.length`.
    - Utils: lodash (`isEmpty`, `debounce`, …); dates: dayjs / `@/libs`.
    - Prettier: singleQuote, tabWidth 4, printWidth 100, trailingComma all.

    ## React / TSX
    - `'use client'` when using hooks, state, browser APIs, or interactive Ant Design.
    - Named exports only (`export const X`); no default export.
    - Component order: Constants → State → useMemo → useEffect → useCallback → JSX (blank line between groups; shorter names first within group).
    - Split components > ~200 lines into sub-components in the same folder; `index.tsx` orchestrates.
    - Lists: stable `key` (prefer `id`); semantic HTML where appropriate.
    - Props/type fields: required vars → optional vars → required fns → optional fns; within each group sort by identifier length (short → long).
    - Responsive required: mobile / tablet / desktop (Tailwind `sm:` / `md:` / `lg:`).
    - All user-facing UI text must go through i18n.

    ## Next.js App Router
    - `(public)/` — no auth; `(root)/` — protected routes.
    - Thin pages: compose from `@/components/module/*` and hooks.
    - API routes under `src/app/api/`; client env: `NEXT_PUBLIC_` prefix.
    - No Pages Router; no bypassing Refine data layer in layouts.

    ## Scope & scripts
    - Minimal change scope; no drive-by refactors.
    - `npm run dev` | `build` | `lint` | `lint:fix` | `prettier`

# Per-artifact rules — additive to schema built-in guidance.
rules:
    proposal:
        - Keep proposals concise (1–2 pages); focus on WHY, not HOW.
        - 'In Impact, name affected src/ areas (app routes, module, custom, interfaces, enums, services).'
        - 'New UI that repeats Ant Design patterns → plan a @/components/custom wrapper, not one-off in module/page.'
        - Mark breaking API or Refine resource changes as **BREAKING**.
        - 'Capabilities use kebab-case; check openspec/specs/ before listing Modified Capabilities.'

    specs:
        - 'Requirements use SHALL/MUST; each requirement has at least one #### Scenario: (exactly 4 hashes).'
        - User-facing behavior in specs must assume i18n for all visible strings.
        - UI requirements must state responsive behavior (mobile, tablet, desktop).
        - Data/list features should reference Refine patterns (table, filter, modal CRUD) when applicable.
        - MODIFIED requirements must include the full updated requirement block, not partial deltas.

    design:
        - 'Reference concrete paths under src/ (module feature folder, custom wrapper, page route).'
        - 'Import strategy: @/ barrels only; document new index.ts exports if adding modules.'
        - 'UI decisions: custom → common → antd; if new CustomXxx needed, include scan-and-migrate plan.'
        - 'New types in src/interfaces/<domain>.d.ts; enums in src/enums/; API in src/services/ extending BaseApi.'
        - 'Component structure: named exports, ~200 line split threshold, Refine hooks for CRUD.'
        - 'Call out i18n keys/namespaces for new copy; no hardcoded user-visible strings in design examples.'

    tasks:
        - 'Order work by dependency: types/enums → services → custom/common → module → app page.'
        - "Each task verifiable in one session; use checkbox format '- [ ] X.Y Description'."
        - 'When adding CustomXxx: include scan existing usage, implement wrapper, migrate all call sites, grep-verify.'
        - 'End with npm run lint (and build if routing or types change significantly).'
        - Do not include unrelated refactors or scope outside the change proposal.
